# Validate commit messages
commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

# Validate content before committing
pre-commit:
  jobs:
    - name: ultracite
      run: pnpm exec ultracite fix --type-aware --type-check
      glob:
        - '**/*.js'
        - '**/*.jsx'
        - '**/*.ts'
        - '**/*.tsx'
        - '**/*.json'
        - '**/*.jsonc'
        - '**/*.css'
      stage_fixed: true
    # Import boundaries. Oxlint cannot express directional zones between
    # layers, so ESLint owns this one rule set. See eslint.config.mjs.
    - name: boundaries
      run: pnpm run check:boundaries
      glob:
        - 'src/**/*.ts'
        - 'src/**/*.tsx'
    - name: knip
      run: pnpm run check:deps
      glob: '*'
