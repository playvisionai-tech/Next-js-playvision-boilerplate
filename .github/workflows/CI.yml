name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore or cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: nextjs-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}

      - name: Build Next.js
        run: pnpm run build-local
        env:
          NEXT_PUBLIC_SENTRY_DISABLED: 'true' # Only upload Sentry source maps in deployment
          NEXT_PUBLIC_APP_URL: http://localhost:3008

      # The example slice is a reference, not product code, so it must not be
      # reachable in anything that ships. `pageExtensions` in next.config.ts is
      # what excludes it — one careless edit there puts it back, and nothing
      # else would notice. Assert against the built route manifest rather than
      # trusting the config.
      - name: Development-only routes are absent from the production build
        run: |
          manifest=.next/app-path-routes-manifest.json
          if [ ! -f "$manifest" ]; then
            echo "$manifest is missing - the build produced no route manifest"; exit 1
          fi
          # Ask the filesystem which routes are development-only, not the slice
          # name: a manifest key is the app directory plus the page, so every
          # page.dev.* file names the key that must not be there. Renaming the
          # example slice or adding a second dev-only route stays covered.
          leaked=
          while IFS= read -r page; do
            key="${page#src/app}"; key="${key%/*}/page"
            if grep -qF "\"$key\"" "$manifest"; then
              leaked="$leaked $key"
            fi
          done < <(find src/app -type f -name 'page.dev.*')
          # A half-registered dev route: `pageExtensions` matched the file but
          # stripped only the final extension, leaving a `page.dev` key behind.
          leaked="$leaked $(grep -o '"[^"]*/page\.dev"' "$manifest" || true)"
          if [ -n "${leaked// /}" ]; then
            echo "Development-only routes leaked into the production build:"
            echo "$leaked"; exit 1
          fi
          echo "dev-only route guard OK (no development-only route in the production manifest)"

      - if: matrix.node-version == '24.x' && success()
        name: Cache Next.js build output
        uses: actions/cache/save@v5
        with:
          path: |
            .next
            next-env.d.ts
          key: nextjs-build-${{ matrix.node-version }}-${{ github.sha }}

  static:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Retrieve Git history, needed to verify commits

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        run: pnpm exec commitlint --from $BASE_SHA --to $HEAD_SHA --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Linter
        run: pnpm exec next typegen && pnpm run lint

      - name: Import boundaries
        run: pnpm run check:boundaries

      # Two rules that would otherwise be review-only. Both fail silently in
      # the app: a missing setRequestLocale drops a page out of static
      # rendering, and a missing server-only import removes the bundler guard.
      - name: Every locale page calls setRequestLocale
        run: |
          # page*, not page: development-only routes are page.dev.tsx, and the
          # narrower pattern skipped them without saying so. Every extension in
          # `pageExtensions` is here too - a page.ts route is as routable as a
          # page.tsx one, and matching only .tsx never opened it.
          files=$(grep -rl "" src/app/\[locale\] --include='page*.tsx' --include='page*.ts' --include='page*.jsx' --include='page*.js' || true)
          if [ -z "$files" ]; then
            echo "locale check covered zero files"; exit 1
          fi
          # A call site, not a mention: a page that imports setRequestLocale and
          # never calls it is precisely the silent drop out of static rendering
          # this step exists to catch, and it passed a substring match.
          missing=$(echo "$files" | xargs grep -L "setRequestLocale(" || true)
          if [ -n "$missing" ]; then
            echo "Missing setRequestLocale in:"; echo "$missing"; exit 1
          fi

      - name: Every server-tier file imports server-only
        run: |
          # The lib modules that own the connection and the API keys, not just
          # features/<f>/server/: db/client.ts, db/connection.ts and
          # security/arcjet.ts all rely on the import and none was covered.
          # db/schema.ts is excluded on purpose - drizzle-kit loads it outside
          # the Next bundle, so `server-only` there breaks `pnpm db:generate`.
          # No 2>/dev/null: a search root that stops existing must fail here.
          files=$(find src/features/*/server src/lib/db src/lib/security -type f -not -path '*/__tests__/*' -not -path 'src/lib/db/schema.ts' \( -name '*.ts' -o -name '*.tsx' \))
          if [ -z "$files" ]; then
            echo "server-only check covered zero files"; exit 1
          fi
          missing=$(echo "$files" | xargs grep -L "^import 'server-only';" || true)
          if [ -n "$missing" ]; then
            echo "Missing server-only import in:"; echo "$missing"; exit 1
          fi

      # Both locations, so the check keeps covering something when a feature has
      # no local/ tier: browser storage lives in features/<f>/local/ and in the
      # lib modules that own a browser API outright. nullglob so an unmatched
      # features/*/local disappears instead of reaching find as a literal path,
      # where its error - and the coverage it stood for - used to be swallowed.
      # The lib roots are not globs, so they are checked by hand: one of them
      # being deleted must fail here rather than quietly narrow the search.
      - name: Every browser-storage file imports client-only
        run: |
          shopt -s nullglob
          roots=(src/features/*/local)
          for lib in src/lib/local-db src/lib/offline-queue; do
            if [ ! -d "$lib" ]; then
              echo "$lib is missing - the client-only check lost a search root"; exit 1
            fi
            roots+=("$lib")
          done
          files=$(find "${roots[@]}" -type f -not -path '*/__tests__/*' \( -name '*.ts' -o -name '*.tsx' \))
          if [ -z "$files" ]; then
            echo "client-only check covered zero files"; exit 1
          fi
          missing=$(echo "$files" | xargs grep -L "^import 'client-only';" || true)
          if [ -n "$missing" ]; then
            echo "Missing client-only import in:"; echo "$missing"; exit 1
          fi

      - name: Check dependencies
        run: pnpm run check:deps

      - name: I18n check
        run: pnpm run check:i18n

  unit:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        uses: docker://mcr.microsoft.com/playwright:v1.60.0
        with:
          # The Playwright image ships Node and npm but not pnpm; corepack
          # installs the exact version pinned by `packageManager`.
          # `--coverage` is passed directly, not as `-- --coverage`: pnpm
          # forwards the bare `--` as a literal argument and vitest treats
          # everything after it as passthrough, so the flag is silently
          # dropped and Codecov gets nothing to upload.
          args: sh -c "corepack enable && pnpm run test --coverage"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  storybook:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run storybook tests
        uses: docker://mcr.microsoft.com/playwright:v1.60.0
        with:
          # The Playwright image ships Node and npm but not pnpm; corepack
          # installs the exact version pinned by `packageManager`.
          args: sh -c "corepack enable && pnpm run storybook:test"

  e2e:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]

    # Job-level so the Chromatic step's `if` can read it; a step cannot read
    # env it declares itself.
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # For chromatic

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
          restore-nextjs-cache: true

      - name: Run E2E tests
        uses: docker://mcr.microsoft.com/playwright:v1.60.0
        with:
          # HOME=/root avoids a Playwright error with Firefox. The Playwright
          # image ships Node and npm but not pnpm; corepack installs the exact
          # version pinned by `packageManager`.
          args: sh -c "export HOME=/root && corepack enable && pnpm run test:e2e"
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Fix test results permission # Give permissions to test results needed by Chromatic
        run: |
          sudo chmod -R 777 test-results

      # Skipped rather than failed when unconfigured. Chromatic validates the
      # token against its service, so a placeholder cannot stand in, and a
      # missing one would otherwise redden a run whose 34 tests all passed.
      - name: Run visual regression tests
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@v17
        with:
          playwright: true
          exitOnceUploaded: true # Speed up by skipping the build results
          outputDir: storybook-static
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  synchronize-with-crowdin:
    name: GitHub PR synchronize with Crowdin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.event_name == 'pull_request'

    # Job-level so the step condition below can read them. Without credentials
    # the action fails the check rather than skipping, which reads as a broken
    # build on every fork and every repo that has not configured Crowdin.
    env:
      CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }} # Crowdin Actions needs to push commits to the PR branch, checkout HEAD commit instead of merge commit
          fetch-depth: 0

      - name: Crowdin action
        if: env.CROWDIN_PERSONAL_TOKEN != '' && env.CROWDIN_PROJECT_ID != ''
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: true
          download_translations: true
          create_pull_request: false
          localization_branch_name: ${{ github.head_ref || github.ref_name }} # explanation here: https://stackoverflow.com/a/71158878
          commit_message: 'chore: new Crowdin translations by GitHub Action'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
