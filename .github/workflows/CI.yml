name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore or cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: nextjs-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}

      - name: Build Next.js
        run: pnpm run build-local
        env:
          NEXT_PUBLIC_SENTRY_DISABLED: 'true' # Only upload Sentry source maps in deployment
          NEXT_PUBLIC_APP_URL: http://localhost:3008

      # The example slice is a reference, not product code, so it must not be
      # reachable in anything that ships. `pageExtensions` in next.config.ts is
      # what excludes it — one careless edit there puts it back, and nothing
      # else would notice. Assert against the built route manifest rather than
      # trusting the config.
      - name: Development-only routes are absent from the production build
        run: |
          manifest=.next/app-path-routes-manifest.json
          if [ ! -f "$manifest" ]; then
            echo "$manifest is missing - the build produced no route manifest"; exit 1
          fi
          config=next.config.ts
          if [ ! -f "$config" ]; then
            echo "$config is missing - nothing declares which pages are development-only"; exit 1
          fi
          # The routable extensions, and the marker that makes a route
          # development-only, hard-coded. `pageExtensions` in next.config.ts
          # owns both; this is a copy, and the loop below is the only thing
          # holding the two together.
          #
          # A copy on purpose. Deriving them by parsing the declaration out
          # of next.config.ts from bash was tried and is worse, in four ways
          # each reproduced against this repo: an idiomatic
          # `['dev.tsx', ...baseExtensions]` refactor collapses the derived
          # list to `tsx` alone - non-empty, so no coverage floor fires, and
          # every page.ts route silently stops being checked; deleting the
          # ternary, which next.config.ts explicitly invites, leaves a
          # single-line declaration the sed range over-runs, reading unrelated
          # arrays out of `baseConfig` as extensions; `export const` in front
          # of it made the step exit 1 with no output at all, the assignment
          # ending in a grep that `set -e` killed before any diagnostic; and a
          # comment inside the declaration was read as data and redefined the
          # marker. A list that drifts loudly beats a parser that fails
          # silently.
          #
          # What the loop below catches if the two diverge: the marker renamed
          # (page.dev.tsx -> page.development.tsx), or an extension dropped.
          # What it cannot catch: an extension ADDED in next.config.ts. Pages
          # using it go unchecked until it is added here too - so when you edit
          # `pageExtensions`, edit this list and the locale check in the static
          # job with it.
          marker=dev
          exts='tsx ts jsx js'
          for literal in "$marker.tsx" $exts; do
            if ! grep -qF "'$literal'" "$config"; then
              echo "$config no longer declares '$literal' among its page extensions."
              echo "This guard hard-codes marker=$marker and exts='$exts' - update it to match $config."
              echo "If the development-only route convention was removed along with the example slice, remove the marker from here too."
              exit 1
            fi
          done
          # A search root that stops existing must fail here. The previous
          # `while ... done < <(find src/app ...)` could not enforce that: a
          # process substitution's exit status is not the enclosing command's,
          # so `set -e` never saw find fail and the guard reported OK having
          # examined nothing. find's status is now checked directly, and
          # -print0 keeps paths containing whitespace intact.
          if [ ! -d src/app ]; then
            echo "src/app is missing - the dev-only route guard lost its search root"; exit 1
          fi
          names=()
          for ext in $exts; do
            names+=(-o -name "page.$marker.$ext")
          done
          variants=$(mktemp)
          trap 'rm -f "$variants"' EXIT
          if ! find src/app -type f -not -path '*/__tests__/*' \( "${names[@]:1}" \) -print0 > "$variants"; then
            echo "find failed under src/app - the dev-only route guard could not read its search root"; exit 1
          fi
          covered=0
          leaked=
          while IFS= read -r -d '' page; do
            covered=$((covered + 1))
            # Ask the filesystem which routes are development-only, not the
            # slice name: a manifest key is the app directory plus the page, so
            # every page.$marker.* file names the key that must not be there.
            # Renaming the example slice, or adding a second development-only
            # route, stays covered.
            key="${page#src/app}"; key="${key%/*}/page"
            if grep -qF "\"$key\"" "$manifest"; then
              leaked="$leaked $key"
            fi
          done < "$variants"
          # Covering zero files is reported, not failed: a repo with no
          # development-only route is legitimate - the example slice is meant
          # to be deletable, and next.config.ts says so. The manifest half
          # below keeps asserting something either way.
          #
          # A half-registered dev route: `pageExtensions` matched the file but
          # stripped only the final extension, leaving a `page.<marker>` key
          # behind. Any dotted page key qualifies whatever the marker.
          leaked="$leaked $(grep -oE '"[^"]*/page\.[^"]*"' "$manifest" || true)"
          if [ -n "${leaked// /}" ]; then
            echo "Development-only routes leaked into the production build:"
            echo "$leaked"; exit 1
          fi
          echo "dev-only route guard OK ($covered page.$marker.* file(s) covered, none in the production manifest)"

      - if: matrix.node-version == '24.x' && success()
        name: Cache Next.js build output
        uses: actions/cache/save@v5
        with:
          path: |
            .next
            next-env.d.ts
          key: nextjs-build-${{ matrix.node-version }}-${{ github.sha }}

  static:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Retrieve Git history, needed to verify commits

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        run: pnpm exec commitlint --from $BASE_SHA --to $HEAD_SHA --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Linter
        run: pnpm exec next typegen && pnpm run lint

      - name: Import boundaries
        run: pnpm run check:boundaries

      # Two rules that would otherwise be review-only. Both fail silently in
      # the app: a missing setRequestLocale drops a page out of static
      # rendering, and a missing server-only import removes the bundler guard.
      - name: Every locale page calls setRequestLocale
        run: |
          root='src/app/[locale]'
          if [ ! -d "$root" ]; then
            echo "$root is missing - the locale check lost its search root"; exit 1
          fi
          config=next.config.ts
          if [ ! -f "$config" ]; then
            echo "$config is missing - nothing declares which files are pages"; exit 1
          fi
          # Hard-coded copy of `pageExtensions` in next.config.ts, asserted
          # against it below rather than parsed out of it - the dev-only route
          # guard in the build job carries the full reasoning, and the same
          # divergence rules apply here: a renamed marker or a dropped
          # extension fails loudly, an added one is only covered once it is
          # added to this list too.
          marker=dev
          exts='tsx ts jsx js'
          for literal in "$marker.tsx" $exts; do
            if ! grep -qF "'$literal'" "$config"; then
              echo "$config no longer declares '$literal' among its page extensions."
              echo "This check hard-codes marker=$marker and exts='$exts' - update it to match $config."
              echo "If the development-only route convention was removed along with the example slice, remove the marker from here too."
              exit 1
            fi
          done
          # The exact routable page filenames, not a `page*` glob. `page*.tsx`
          # also matches page.stories.tsx, page.test.tsx and page.d.ts - none
          # of them routes, all of them then reported as missing a call they
          # must not make. page.$marker.tsx is listed explicitly because it is
          # a route outside production, and matching only `page.<ext>` skipped
          # every development-only route without saying so.
          names=()
          for ext in $exts; do
            names+=(-o -name "page.$ext")
          done
          names+=(-o -name "page.$marker.tsx")
          list=$(mktemp)
          trap 'rm -f "$list"' EXIT
          # NUL-delimited end to end. `echo "$files" | xargs grep -L` split
          # every path on whitespace, handed grep paths that do not exist, and
          # `|| true` swallowed the resulting exit 123 - so a page under a
          # directory whose name contains a space was never checked and the
          # step passed. find also lists zero-byte files, which `grep -rl ""`
          # does not, so an empty page.tsx is covered now too. __tests__ is
          # excluded for the same reason as in the other checks: a co-located
          # test is where agents/rules/testing-placement.md puts it.
          if ! find "$root" -type f -not -path '*/__tests__/*' \( "${names[@]:1}" \) -print0 > "$list"; then
            echo "find failed under $root - the locale check could not read its search root"; exit 1
          fi
          # A call site, not a mention: a page that imports setRequestLocale
          # and never calls it is precisely the silent drop out of static
          # rendering this step exists to catch, and a literal search for
          # "setRequestLocale(" is equally satisfied by
          # `// TODO: call setRequestLocale(locale) here`. So comments are
          # removed first - whole `/* */` blocks by range, not merely lines
          # that happen to start with `*`, plus `//` comments - and the
          # identifier must then sit immediately before a `(` and immediately
          # after a character that is neither part of an identifier nor a
          # quote nor `>`, which keeps JSX text and string literals from
          # counting. A `//` that is part of `://` is left alone: stripping it
          # blanked lines carrying both a URL and a real call.
          #
          # Residual limitation, stated instead of papered over: this is not a
          # parser, and the comment it replaces claimed to fail closed when it
          # does not. An occurrence in JSX text or a template literal that is
          # separated from what surrounds it by a space still reads as a call,
          # so a page can in principle pass without one. In the other
          # direction, an unbalanced `/*` inside a string literal drops the
          # rest of the file and a `//` inside a string drops the rest of its
          # line, which can only report a real call as missing - noisy, never
          # silent.
          call=$'(^|[^A-Za-z0-9_$>"\'`])setRequestLocale[[:space:]]*\\('
          count=0
          missing=
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! sed -E -e 's,/\*.*\*/,,g' -e '\%/\*%,\%\*/%d' \
              -e 's,^[[:space:]]*//.*$,,' -e 's,([^:])//.*$,\1,' "$file" \
              | grep -Eq "$call"; then
              missing="$missing$file"$'\n'
            fi
          done < "$list"
          if [ "$count" -eq 0 ]; then
            echo "locale check covered zero files"; exit 1
          fi
          if [ -n "$missing" ]; then
            echo "Missing setRequestLocale call in:"; printf '%s' "$missing"; exit 1
          fi
          echo "locale check OK ($count page file(s) covered)"

      - name: Every server-tier file imports server-only
        run: |
          # The lib modules that own the connection and the API keys, not just
          # features/<f>/server/: db/client.ts, db/connection.ts and
          # security/arcjet.ts all rely on the import and none was covered.
          # nullglob so an unmatched features/*/server disappears instead of
          # reaching find as a literal path, where its error - and the coverage
          # it stood for - used to be swallowed. Zero feature server tiers is
          # legitimate: the example slice is the only one today and it is meant
          # to be deletable. The lib roots are not globs, so they are checked by
          # hand: one of them being deleted must fail here rather than quietly
          # narrow the search.
          shopt -s nullglob
          roots=(src/features/*/server)
          feature_roots=${#roots[@]}
          for lib in src/lib/db src/lib/security; do
            if [ ! -d "$lib" ]; then
              echo "$lib is missing - the server-only check lost a search root"; exit 1
            fi
            roots+=("$lib")
          done
          list=$(mktemp)
          trap 'rm -f "$list"' EXIT
          # db/schema.ts is excluded on purpose - drizzle-kit loads it outside
          # the Next bundle, so `server-only` there breaks `pnpm db:generate`
          # and a flagged schema.ts could not be fixed by adding the import.
          # That one file and no other: matching the name plus a `*lib/db/*`
          # fragment also excluded any nested lib/db/schema.ts - one inside a
          # feature's server tier, say - and skipped it silently. Both
          # spellings are listed because find echoes each root as it was given,
          # so the path it prints has no leading component to match against.
          # NUL-delimited for the same reason as the check above.
          if ! find "${roots[@]}" -type f \
            -not -path '*/__tests__/*' \
            -not \( -path 'src/lib/db/schema.ts' -o -path '*/src/lib/db/schema.ts' \) \
            \( -name '*.ts' -o -name '*.tsx' \) -print0 > "$list"; then
            echo "find failed - the server-only check could not read a search root"; exit 1
          fi
          count=0
          feature_count=0
          missing=
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            case "$file" in
              *src/features/*) feature_count=$((feature_count + 1)) ;;
            esac
            if ! grep -q "^import 'server-only';" "$file"; then
              missing="$missing$file"$'\n'
            fi
          done < "$list"
          # Printed rather than left implied by silence - a tier that quietly
          # stopped being covered is only visible in review if the log says how
          # many files it covered.
          echo "server-only check covered $count file(s): $feature_count from $feature_roots features/*/server root(s), $((count - feature_count)) from the lib roots"
          if [ "$count" -eq 0 ]; then
            echo "server-only check covered zero files"; exit 1
          fi
          if [ -n "$missing" ]; then
            echo "Missing server-only import in:"; printf '%s' "$missing"; exit 1
          fi

      # Both locations, so the check keeps covering something when a feature has
      # no local/ tier: browser storage lives in features/<f>/local/ and in the
      # lib modules that own a browser API outright. nullglob so an unmatched
      # features/*/local disappears instead of reaching find as a literal path,
      # where its error - and the coverage it stood for - used to be swallowed.
      # The lib roots are not globs, so they are checked by hand: one of them
      # being deleted must fail here rather than quietly narrow the search.
      - name: Every browser-storage file imports client-only
        run: |
          shopt -s nullglob
          roots=(src/features/*/local)
          feature_roots=${#roots[@]}
          for lib in src/lib/local-db src/lib/offline-queue; do
            if [ ! -d "$lib" ]; then
              echo "$lib is missing - the client-only check lost a search root"; exit 1
            fi
            roots+=("$lib")
          done
          list=$(mktemp)
          trap 'rm -f "$list"' EXIT
          if ! find "${roots[@]}" -type f -not -path '*/__tests__/*' \( -name '*.ts' -o -name '*.tsx' \) -print0 > "$list"; then
            echo "find failed - the client-only check could not read a search root"; exit 1
          fi
          count=0
          feature_count=0
          missing=
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            case "$file" in
              *src/features/*) feature_count=$((feature_count + 1)) ;;
            esac
            if ! grep -q "^import 'client-only';" "$file"; then
              missing="$missing$file"$'\n'
            fi
          done < "$list"
          # Zero feature-tier files is legitimate today: no feature has a
          # local/ tier, so this must not fail. It is printed rather than left
          # implied by silence - a tier that quietly stopped being covered is
          # only visible in review if the log says how many files it covered.
          echo "client-only check covered $count file(s): $feature_count from $feature_roots features/*/local root(s), $((count - feature_count)) from the lib roots"
          if [ "$count" -eq 0 ]; then
            echo "client-only check covered zero files"; exit 1
          fi
          if [ -n "$missing" ]; then
            echo "Missing client-only import in:"; printf '%s' "$missing"; exit 1
          fi

      - name: Check dependencies
        run: pnpm run check:deps

      - name: I18n check
        run: pnpm run check:i18n

      # Pull-request only: the check diffs against the base branch, and
      # `github.base_ref` is empty on a push. Enforces
      # agents/rules/docs-keep-spec-current.md — a module whose code moved
      # without its spec.md moving with it. Only changed modules are
      # inspected, so this is a ratchet rather than a repo-wide audit.
      - if: github.event_name == 'pull_request'
        name: Spec drift
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-specs.js --base "origin/$BASE_REF"

      # Not pull-request only: this one has no base to diff against. It reads
      # every tracked .md and resolves each relative link, so a document that
      # rotted on a push is caught on that push rather than on the next PR that
      # happens to touch it.
      - name: Markdown links
        run: pnpm run check:links

  unit:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        uses: docker://mcr.microsoft.com/playwright:v1.60.0
        with:
          # The Playwright image ships Node and npm but not pnpm; corepack
          # installs the exact version pinned by `packageManager`.
          # `--coverage` is passed directly, not as `-- --coverage`: pnpm
          # forwards the bare `--` as a literal argument and vitest treats
          # everything after it as passthrough, so the flag is silently
          # dropped and Codecov gets nothing to upload.
          args: sh -c "corepack enable && pnpm run test --coverage"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  storybook:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run storybook tests
        uses: docker://mcr.microsoft.com/playwright:v1.60.0
        with:
          # The Playwright image ships Node and npm but not pnpm; corepack
          # installs the exact version pinned by `packageManager`.
          args: sh -c "corepack enable && pnpm run storybook:test"

  e2e:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]

    # Job-level so the Chromatic step's `if` can read it; a step cannot read
    # env it declares itself.
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # For chromatic

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
          restore-nextjs-cache: true

      - name: Run E2E tests
        uses: docker://mcr.microsoft.com/playwright:v1.60.0
        with:
          # HOME=/root avoids a Playwright error with Firefox. The Playwright
          # image ships Node and npm but not pnpm; corepack installs the exact
          # version pinned by `packageManager`.
          args: sh -c "export HOME=/root && corepack enable && pnpm run test:e2e"
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Fix test results permission # Give permissions to test results needed by Chromatic
        run: |
          sudo chmod -R 777 test-results

      # Skipped rather than failed when unconfigured. Chromatic validates the
      # token against its service, so a placeholder cannot stand in, and a
      # missing one would otherwise redden a run whose 34 tests all passed.
      - name: Run visual regression tests
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@v17
        with:
          playwright: true
          exitOnceUploaded: true # Speed up by skipping the build results
          outputDir: storybook-static
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  synchronize-with-crowdin:
    name: GitHub PR synchronize with Crowdin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.event_name == 'pull_request'

    # Job-level so the step condition below can read them. Without credentials
    # the action fails the check rather than skipping, which reads as a broken
    # build on every fork and every repo that has not configured Crowdin.
    env:
      CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }} # Crowdin Actions needs to push commits to the PR branch, checkout HEAD commit instead of merge commit
          fetch-depth: 0

      - name: Crowdin action
        if: env.CROWDIN_PERSONAL_TOKEN != '' && env.CROWDIN_PROJECT_ID != ''
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: true
          download_translations: true
          create_pull_request: false
          localization_branch_name: ${{ github.head_ref || github.ref_name }} # explanation here: https://stackoverflow.com/a/71158878
          commit_message: 'chore: new Crowdin translations by GitHub Action'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
