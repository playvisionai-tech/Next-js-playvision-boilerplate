name: Release

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed
    branches:
      - main

jobs:
  release:
    strategy:
      matrix:
        node-version: [24.x]

    name: Create a new release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `types: [completed]` fires when CI finishes with any conclusion, failure
    # and cancellation included. Without this the release is not gated on CI at
    # all — semantic-release would tag and publish off a red build.
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      # Two different questions, so two steps. Signature verification is what
      # the name used to claim and `pnpm audit` never did: it checks the
      # registry signatures of what was actually installed, depends on nothing
      # but the lockfile, and today reports 1809 of 1809 packages verified — so
      # it is safe to block a release on.
      - name: Verify the registry signatures of installed dependencies
        run: pnpm audit signatures

      # Advisories are not: `pnpm audit --audit-level high` currently exits 1 on
      # 35 high and 2 critical findings, all transitive (postcss via next,
      # fast-uri via @sentry/nextjs) with no fix available to us. Blocking here
      # would mean any newly published advisory stops releases with no code
      # change on our side, so this reports and does not gate. Drop the
      # `|| true` once the tree is clean and someone owns keeping it clean.
      - name: Report known high-severity advisories in installed dependencies
        run: pnpm audit --audit-level high || true

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
