name: Setup Node.js and dependencies
description: Setup Node.js environment with pnpm dependencies

inputs:
  node-version:
    description: Node.js version
    required: true
  restore-nextjs-cache:
    description: Whether to restore Next.js build cache
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generate Next.js types
      shell: bash
      run: pnpm exec next typegen

    - name: Restore Next.js build cache
      if: inputs.restore-nextjs-cache == 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          .next
          next-env.d.ts
        key: nextjs-build-24.x-${{ github.sha }}
